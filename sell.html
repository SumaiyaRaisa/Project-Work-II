<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell a Book — LibShare</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sell.css">
</head>
<body>

  <header>
    <div class="wrap header-inner">
      <div class="logo">Lib<span>Share</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="login.html">Login</a>
        <button class="theme-btn" id="themeToggle">Dark mode</button>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="wrap">
      <div class="sell-card">
        <h1>Sell a Book</h1>

        <form id="sellForm" autocomplete="off">
          <label>
            Book title
            <input type="text" id="bookTitle" required>
          </label>

          <label>
            Author
            <input type="text" id="bookAuthor" required>
          </label>

          <label>
            Category
            <input type="text" id="bookCategory" placeholder="e.g. Fiction, Academic, Poetry" required>
          </label>

          <label>
            Condition
            <select id="bookCondition">
              <option>New</option>
              <option selected>Good</option>
              <option>Fair</option>
              <option>Worn</option>
            </select>
          </label>

          <label>
            Description
            <textarea id="bookDescription" rows="4" placeholder="A short note about the book, edition, or its condition"></textarea>
          </label>

          <label>
            Book cover
            <input type="file" id="bookCover" accept="image/*">
          </label>

          <label>
            Price
            <div class="price-field">
              <span class="price-symbol">৳</span>
              <input type="number" id="bookPrice" min="0" step="1" inputmode="numeric" placeholder="0" required>
            </div>
          </label>

          <p class="form-error" id="sellError">Please fill in the required fields.</p>

          <div class="sell-actions">
            <button type="submit">List for Sale</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">LibShare, a student project</div>
  </footer>

  <script>
    document.getElementById('sellForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const book = {
        title: document.getElementById('bookTitle').value.trim(),
        author: document.getElementById('bookAuthor').value.trim(),
        category: document.getElementById('bookCategory').value.trim(),
        condition: document.getElementById('bookCondition').value,
        description: document.getElementById('bookDescription').value.trim(),
        price: Number(document.getElementById('bookPrice').value),
        type: 'sell'
        // book cover file is sent separately as FormData when connected to the backend
      };

      const error = document.getElementById('sellError');
      const priceValue = document.getElementById('bookPrice').value;
      if (!book.title || !book.author || !book.category || priceValue === '' || book.price < 0) {
        error.style.display = 'block';
        return;
      }
      error.style.display = 'none';

      // fetch('/api/books', { method: 'POST', body: ... }) goes here later
      console.log('book listed for sale:', book);
    });

    // Theme toggle — same as other pages
    const themeBtn = document.getElementById('themeToggle');
    const root = document.documentElement;
    if (localStorage.getItem('theme') === 'dark') {
      root.setAttribute('data-theme', 'dark');
      themeBtn.textContent = 'Light mode';
    }
    themeBtn.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      root.setAttribute('data-theme', isDark ? 'light' : 'dark');
      themeBtn.textContent = isDark ? 'Dark mode' : 'Light mode';
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });
  </script>

</body>
</html>
